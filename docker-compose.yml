version: "3.9"

# Example deployment: a relay (deploy this on a host with unrestricted DNS
# access) and a client (deploy this wherever DoH is restricted, pointed at
# the relay). Adjust config/*.toml before using in production, and put a
# real domain + TLS termination (e.g. Traefik/Caddy) in front of the relay --
# this compose file deliberately does not include TLS, since it's usually
# handled by whatever reverse proxy already fronts your other services.

services:
  power-dns-relay:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config/relay.toml:/app/config.toml:ro
      # If you enable [api.relay_dot] in config/relay.toml, mount your
      # certificate/key here too and reference them by their in-container
      # paths, e.g.:
      # - ./certs:/app/certs:ro
    ports:
      - "8000:8000" # put a TLS-terminating reverse proxy in front of this in production
      - "853:853"   # only needed if [api.relay_dot] is enabled
    restart: unless-stopped

  power-dns-client:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ./config/client.toml:/app/config.toml:ro
      - power-dns-client-data:/app/data
    ports:
      - "127.0.0.1:5335:5335/udp"
      - "127.0.0.1:5335:5335/tcp"
      - "127.0.0.1:8001:8000"
    depends_on:
      - power-dns-relay
    restart: unless-stopped

volumes:
  power-dns-client-data:
